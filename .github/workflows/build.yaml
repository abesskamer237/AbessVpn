name: Build APK Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create android folder
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create . --org com.bebe.tunnel --project-name b_b_tunnel --platforms android
            rm -f lib/main.dart
            git checkout -- lib/main.dart pubspec.yaml 2>/dev/null || true
            # Garde notre Manifest custom si il existe
            git checkout -- android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          fi

      - name: Fix v1 embedding
        run: |
          # Patch pour flutter_v2ray
          find $HOME -path "*flutter_v2ray*/android/build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 33/' {} \; 2>/dev/null || true

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: bebe-tunnel-release
          path: build/app/outputs/flutter-apk/app-release.apk
