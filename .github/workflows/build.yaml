name: Build APK Release
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Recreate Android project if missing
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android folder missing, creating..."
            flutter create . --org com.bebe.tunnel --project-name b_b_tunnel --platforms=android --no-overwrite
          fi
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk 21/' android/app/build.gradle || true

      - name: Pub Get
        run: flutter pub get

      - name: Generate Launcher Icon 
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: bebe-tunnel-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
